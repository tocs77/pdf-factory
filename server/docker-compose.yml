services:
  backend:
    build: .
    container_name: pdf-backend
    ports:
      - "4050:${APP_PORT}"
    volumes:
      - ./:/app
      - ./uploads:/app/uploads
      - ./public:/app/public
    depends_on:
      db:
        condition: service_healthy
    restart: always
    environment:
      - MATCHER_URL=http://matcher:8000
    env_file:
      - .env

  matcher:
    build: ../matcher
    container_name: pdf-matcher
    volumes:
      - ./uploads:/app/uploads:ro
    restart: always

  db:
    image: postgres:latest
    container_name: pdf-postgres
    environment:
      POSTGRES_DB: ${DB_NAME}      
      POSTGRES_USER: ${DB_USER}      
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pdf_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest  
    container_name: pdf-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com  
      PGADMIN_DEFAULT_PASSWORD: admin          
    ports:
      - "5051:80" 
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./pgadmin:/pgadmin
volumes:
  pdf_data:  # Volume for PostgreSQL data persistence
